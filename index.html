    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Cache Admin</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffdf8;
            --ink: #1f2a44;
            --muted: #5f6c80;
            --brand: #0f766e;
            --accent: #f97316;
            --ok: #166534;
            --error: #b91c1c;
            --line: #d6d3d1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at top right, #ffe7c2, transparent 45%),
                        radial-gradient(circle at top left, #c9f6f2, transparent 40%),
                        var(--bg);
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            gap: 16px;
        }

        .hero {
            background: linear-gradient(135deg, #0f766e, #1f2937);
            color: #ffffff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1, h2 {
            margin: 0 0 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            flex: 1;
            min-width: 180px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            color: #ffffff;
            background: var(--brand);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .warn {
            background: #b45309;
        }

        .secondary {
            background: #374151;
        }

        .manual {
            background: var(--accent);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1f2937;
        }

        .icon-btn .icon {
            font-size: 16px;
            line-height: 1;
        }

        .time-input {
            min-width: 140px;
            max-width: 170px;
        }

        .status {
            display: grid;
            gap: 6px;
            font-size: 14px;
            color: var(--muted);
        }

        .status strong {
            color: var(--ink);
        }

        .message {
            min-height: 22px;
            font-size: 14px;
            margin-top: 8px;
        }

        .detail-card {
            margin-top: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            background: #fff;
        }

        .detail-card h3 {
            margin: 0 0 10px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .detail-table th,
        .detail-table td {
            padding: 8px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }

        .detail-table th {
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 12px;
        }

        .detail-table td {
            color: var(--ink);
            font-size: 15px;
        }

        .detail-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .detail-table tr:last-child th,
        .detail-table tr:last-child td {
            border-bottom: none;
        }

        .ok {
            color: var(--ok);
        }

        .error {
            color: var(--error);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        .table-wrap {
            max-height: 340px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <section class="hero"
    
    >
        <h1>Branch Cache Admin Console</h1>
        <div>Manage scheduler operations and cache synchronization for Consumer Service</div>
    </section>

    <section class="grid">
        <article class="card">
            <h2>Search Branch</h2>
            <div class="row">
                <input id="pincodeInput" placeholder="Enter pincode" />
                <button id="searchBtn">Search</button>
            </div>
            <div id="searchResult" class="message"></div>
        </article>

        <article class="card">
            <h2>Scheduler Controls</h2>
            <div class="row">
                <button id="startBtn">Start</button>
                <button id="stopBtn" class="warn">Stop</button>
                <button id="resumeBtn" class="secondary">Resume</button>
                <button id="refreshNowBtn" class="manual">Refresh Cache Now</button>
            </div>
            <div class="row" style="margin-top: 10px;">
                <input id="schedulerTimeInput" class="time-input" type="time" value="14:00" />
                <button id="updateTimeBtn" class="icon-btn secondary" title="Change scheduler daily run time">
                    <span class="icon">&#x1F553;</span>
                    <span>Set Time</span>
                </button>
            </div>
            <div id="actionMessage" class="message"></div>
        </article>
    </section>

    <section class="card">
        <h2>Scheduler Status</h2>
        <div class="status">
            <div><strong>Running:</strong> <span id="running">-</span></div>
            <div><strong>Cron:</strong> <span id="cronExpression">-</span></div>
            <div><strong>Last Refresh:</strong> <span id="lastRefresh">-</span></div>
            <div><strong>Next Scheduled Run:</strong> <span id="nextRun">-</span></div>
            <div><strong>Cache Size:</strong> <span id="cacheSize">-</span></div>
            <div><strong>Last Status Message:</strong> <span id="statusMessage">-</span></div>
        </div>
    </section>

</div>

<script>
    async function requestJson(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
            const message = await response.text();
            throw new Error(message || "Request failed");
        }
        return response.json();
    }

    async function requestText(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();
        if (!response.ok) {
            throw new Error(text || "Request failed");
        }
        return text;
    }

    function setMessage(elementId, text, isError) {
        const el = document.getElementById(elementId);
        el.textContent = text;
        el.className = "message " + (isError ? "error" : "ok");
    }

    function formatDate(value) {
        if (!value) {
            return "-";
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return value;
        }
        return date.toLocaleString();
    }

    function cronToTime(cron) {
        if (!cron) {
            return "";
        }
        const parts = cron.trim().split(/\s+/);
        if (parts.length !== 6) {
            return "";
        }
        const minute = Number(parts[1]);
        const hour = Number(parts[2]);
        if (!Number.isInteger(minute) || !Number.isInteger(hour)) {
            return "";
        }
        if (minute < 0 || minute > 59 || hour < 0 || hour > 23) {
            return "";
        }
        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function renderBranchDetails(branches) {
        const headers = [
            "ID",
            "PINCODE",
            "CITY",
            "CITY_CODE",
            "BILLING_STATE",
            "STATE_CODE",
            "BRANCH_NAME",
            "BRANCH_TYPE",
            "PENNANT_BRANCH_CODE",
            "BUSINESS_VERTICAL",
            "PRODUCT_NAMES"
        ];

        const headerRow = headers.map((label) => `<th>${label}</th>`).join("");
        const valueRows = branches.map((branch) => `
            <tr>
                <td>${branch.id ?? "-"}</td>
                <td>${branch.pincode || "-"}</td>
                <td>${branch.city || "-"}</td>
                <td>${branch.cityCode || "-"}</td>
                <td>${branch.billingState || "-"}</td>
                <td>${branch.stateCode || "-"}</td>
                <td>${branch.branchName || "-"}</td>
                <td>${branch.branchType || "-"}</td>
                <td>${branch.pennantBranchCode || "-"}</td>
                <td>${branch.businessVertical || "-"}</td>
                <td>${branch.productNames || "-"}</td>
            </tr>
        `).join("");

        return `
            <div class="detail-card">
                <h3>Branch Details</h3>
                <div class="detail-table-wrap">
                    <table class="detail-table">
                        <thead>
                            <tr>${headerRow}</tr>
                        </thead>
                        <tbody>
                            ${valueRows}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    async function loadStatus() {
        try {
            const status = await requestJson("/consumer/scheduler/status");
            document.getElementById("running").textContent = status.running;
            document.getElementById("cronExpression").textContent = status.cronExpression || "-";
            document.getElementById("lastRefresh").textContent = formatDate(status.lastRefreshTime);
            document.getElementById("nextRun").textContent = formatDate(status.nextScheduledRun);
            document.getElementById("cacheSize").textContent = status.cacheSize ?? "-";
            document.getElementById("statusMessage").textContent = status.lastStatusMessage || "-";
            const parsedTime = cronToTime(status.cronExpression);
            if (parsedTime) {
                document.getElementById("schedulerTimeInput").value = parsedTime;
            }
        } catch (error) {
            setMessage("actionMessage", error.message, true);
        }
    }

    async function searchBranch() {
        const pincode = document.getElementById("pincodeInput").value.trim();
        const result = document.getElementById("searchResult");
        if (!pincode) {
            setMessage("searchResult", "Please enter a pincode", true);
            return;
        }

        try {
            const response = await fetch(`/consumer/${encodeURIComponent(pincode)}`);
            if (response.status === 404) {
                result.className = "message error";
                result.textContent = "Branch not found in cache. Use Refresh Cache Now.";
                return;
            }

            if (!response.ok) {
                throw new Error("Search failed");
            }

            const branches = await response.json();
            if (!Array.isArray(branches) || branches.length === 0) {
                result.className = "message error";
                result.textContent = "Branch not found in cache. Use Refresh Cache Now.";
                return;
            }
            result.className = "message ok";
            result.innerHTML = renderBranchDetails(branches);
        } catch (error) {
            setMessage("searchResult", error.message, true);
        }
    }

    async function runAction(path) {
        try {
            const text = await requestText(path, { method: "POST" });
            setMessage("actionMessage", text, false);
            await loadStatus();
        } catch (error) {
            setMessage("actionMessage", error.message, true);
        }
    }

    async function updateSchedulerTime() {
        const timeValue = document.getElementById("schedulerTimeInput").value;
        if (!timeValue) {
            setMessage("actionMessage", "Please select a time first", true);
            return;
        }

        try {
            const text = await requestText("/consumer/scheduler/time", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ time: timeValue })
            });
            setMessage("actionMessage", text, false);
            await loadStatus();
        } catch (error) {
            setMessage("actionMessage", error.message, true);
        }
    }

    document.getElementById("searchBtn").addEventListener("click", searchBranch);
    document.getElementById("startBtn").addEventListener("click", () => runAction("/consumer/scheduler/start"));
    document.getElementById("stopBtn").addEventListener("click", () => runAction("/consumer/scheduler/stop"));
    document.getElementById("resumeBtn").addEventListener("click", () => runAction("/consumer/scheduler/resume"));
    document.getElementById("refreshNowBtn").addEventListener("click", () => runAction("/consumer/scheduler/refresh"));
    document.getElementById("updateTimeBtn").addEventListener("click", updateSchedulerTime);

    loadStatus();
    setInterval(loadStatus, 15000);
</script>
</body>
</html>
